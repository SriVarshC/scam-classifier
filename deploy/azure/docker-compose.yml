# Runs on the Azure VM:  docker compose --env-file .env up -d --build   (from deploy/azure/)
# Only Caddy is reachable from the internet (ports 80/443). Ollama and the service stay on the private network.
services:
  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"        # keep qwen2.5:7b loaded in RAM between calls
      OLLAMA_NUM_PARALLEL: "1"        # one request at a time = fastest single answer on CPU
    volumes:
      - ollama-models:/root/.ollama
    networks: [internal]

  service:
    build:
      context: ../..
      dockerfile: deploy/azure/Dockerfile
    restart: unless-stopped
    depends_on: [ollama]
    environment:
      SCAM_SERVICE_TOKEN: ${SCAM_SERVICE_TOKEN:?set SCAM_SERVICE_TOKEN in deploy/azure/.env}
      OLLAMA_HOST_URL: http://ollama:11434
      CALL_LLM_PROVIDER: ollama
      CALL_LLM_MODEL: ${CALL_LLM_MODEL:-qwen2.5:7b}
      SCAM_LLM_TIMEOUT_SECONDS: ${SCAM_LLM_TIMEOUT_SECONDS:-100}
      CALL_LLM_NUM_CTX: ${CALL_LLM_NUM_CTX:-4096}
      CALL_LLM_NUM_PREDICT: ${CALL_LLM_NUM_PREDICT:-350}
      CALL_LLM_NUM_THREAD: ${CALL_LLM_NUM_THREAD:-}
      CALL_LLM_KEEP_ALIVE: "24h"
    networks: [internal]

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [service]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/azure/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [internal]

volumes:
  ollama-models:
  caddy-data:

networks:
  internal:
